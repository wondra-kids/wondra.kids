<script>

/* WONDRA — analytics first-party, sans cookies ni données personnelles (fondation 2.7).
   Envoie : route de la page, domaine de provenance, uuid aléatoire quotidien (comptage
   unique). Pas d'IP, pas de user-agent, pas de fingerprint. */
(function(){
  var cfg=window.WONDRA_SUPABASE||{};
  if(!cfg.url||!cfg.anonKey)return;
  function route(){
    try{var r=document.body&&document.body.getAttribute('data-route');return (r&&r!=='')?r:(location.pathname||'/');}catch(e){return location.pathname||'/';}
  }
  function refDomain(r){
    try{var a=document.createElement('a');a.href=r||'';return a.hostname||'';}catch(e){return '';}
  }
  function vid(){
    var K='wondra_pv',D='wondra_pv_day',today=new Date().toISOString().slice(0,10);
    try{
      if(localStorage.getItem(D)!==today){localStorage.removeItem(K);localStorage.setItem(D,today);}
      var id=localStorage.getItem(K);
      if(!id){id='xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16);});localStorage.setItem(K,id);}
      return id;
    }catch(e){return null;}
  }
  function send(){
    try{
      fetch(cfg.url+'/rest/v1/rpc/log_page_view',{
        method:'POST',
        headers:{'apikey':cfg.anonKey,'Authorization':'Bearer '+cfg.anonKey,'Content-Type':'application/json'},
        body:JSON.stringify({p_path:route(),p_referrer:document.referrer||'',p_visitor:vid()}),
        keepalive:true
      }).catch(function(){});
    }catch(e){}
  }
  send();
  try{
    if(document.body){
      var last=route();
      var mo=new MutationObserver(function(){var r=route();if(r&&r!==last){last=r;send();}});
      mo.observe(document.body,{attributes:true,attributeFilter:['data-route']});
    }
  }catch(e){}
})();
